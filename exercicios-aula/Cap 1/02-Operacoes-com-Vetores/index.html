<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 - Operações com Vetores</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    ></script>

    <link rel="stylesheet" href="../sala-styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header-left">
          <h1 class="title">02 - Operações com Vetores</h1>
          <p class="subtitle">Exercícios 4–7</p>
        </div>
        <div class="header-right">
          <p class="course-info">Geometria Analítica - 2026/1</p>
        </div>
      </header>

      <div class="instructions">
        <p>Selecione um exercício abaixo para visualizar.</p>
      </div>

      <main class="columns" id="exercicios-container"></main>

      <footer class="footer">
        <p>Geometria Analítica - Exercícios de Sala | Capítulo I: O Espaço Vetorial R²</p>
      </footer>
    </div>

    <script>
      const EXERCICIOS = [
        'exercicio-4.html',
        'exercicio-5.html',
        'exercicio-6.html',
        'exercicio-7.html',
        'exercicio-10.html',
        'exercicio-11.html',
        'exercicio-12.html',
      ];

      async function carregarExercicios() {
        const container = document.getElementById('exercicios-container');

        for (const arquivo of EXERCICIOS) {
          try {
            const response = await fetch(arquivo);
            if (!response.ok) throw new Error('Falha ao carregar ' + arquivo);
            const html = await response.text();
            container.insertAdjacentHTML('beforeend', html);
          } catch (erro) {
            console.error('Erro ao carregar ' + arquivo + ':', erro);
            container.insertAdjacentHTML(
              'beforeend',
              '<p style="color: red;">Erro ao carregar ' + arquivo + '</p>'
            );
          }
        }

        renderMathInElement(document.body, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
          ],
          throwOnError: false,
        });
      }

      document.addEventListener('DOMContentLoaded', carregarExercicios);
    </script>
  </body>
</html>
