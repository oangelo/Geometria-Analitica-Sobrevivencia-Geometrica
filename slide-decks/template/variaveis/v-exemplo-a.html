<section>
  <div class="slide-header">SEÇÃO [NN] · [TÓPICO]</div>
  <div class="slide-body">
    <h3>Exemplo: [Título]</h3>
    <div class="dual-panel">
      <div class="problem-section">
        <p>[Enunciado matemático — calculável em aula]</p>
      </div>
      <div class="v-bar"></div>
      <div class="narrative-section">
        <span class="narrative-label">[CONTEXTO/SINTOMA]</span>
        <p>[Fragmento: 2-4 frases, tom seco. Dado numérico só com fonte (#47)]</p>
      </div>
    </div>
  </div>
  <div class="slide-footer">GA-CH[N]-[ANO] · CAPÍTULO [N]</div>
</section>
