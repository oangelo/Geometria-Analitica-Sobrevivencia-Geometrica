<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Geometria Analítica: Sobrevivência Geométrica — Cap. VI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/reveal.js@5.1.0/dist/reveal.css" />
    <link rel="stylesheet" href="https://unpkg.com/reveal.js@5.1.0/dist/theme/black.css" id="theme" />
    <link rel="stylesheet" href="https://unpkg.com/reveal.js@5.1.0/plugin/highlight/monokai.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides" id="slides"></div>
    </div>
    <script src="https://unpkg.com/reveal.js@5.1.0/dist/reveal.js"></script>
    <script src="https://unpkg.com/reveal.js@5.1.0/plugin/notes/notes.js"></script>
    <script src="https://unpkg.com/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
    <script src="https://unpkg.com/reveal.js@5.1.0/plugin/math/math.js"></script>
    <script src="https://unpkg.com/reveal.js@5.1.0/plugin/zoom/zoom.js"></script>
    <script>
      window.MathJax = {
        tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
        svg: { fontCache: 'global' },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script>
      const SECTIONS = [
        "capitulo-vi/00-capa.html",
        "capitulo-vi/01-narrativa.html",
        "capitulo-vi/02-espaco-vetorial-r3.html",
        "capitulo-vi/03-produto-interno-no-r3.html",
        "capitulo-vi/04-determinantes.html",
        "capitulo-vi/05-produto-vetorial-e-misto.html",
        "capitulo-vi/06-areas-e-volumes.html",
        "capitulo-vi/07-equacao-do-plano.html",
        "capitulo-vi/08-equacoes-da-reta.html",
        "capitulo-vi/09-sistemas-3x3.html",
        "capitulo-vi/10-superficie-esferica.html",
        "capitulo-vi/11-resumo.html",
        "capitulo-vi/12-reflexao.html"
      ];

      async function loadAndInit() {
        const container = document.getElementById('slides');
        const pendingScripts = [];

        for (const url of SECTIONS) {
          try {
            const res  = await fetch(url);
            if (!res.ok) throw new Error('Falha ao carregar ' + url);
            const text = await res.text();
            const doc  = new DOMParser().parseFromString(text, 'text/html');

            // Apenas seções de nível superior do fragmento (decisão #45: body > section)
            doc.body.querySelectorAll(':scope > section').forEach(s => {
              container.appendChild(document.importNode(s, true));
            });

            // Collect inline scripts (skip Reveal.initialize and MathJax config)
            doc.querySelectorAll('body script:not([src])').forEach(s => {
              const content = s.textContent.trim();
              if (content &&
                  !content.includes('Reveal.initialize') &&
                  !content.includes('window.MathJax =')) {
                pendingScripts.push(content);
              }
            });
          } catch (e) {
            console.error(e);
          }
        }

        // Re-execute scripts with DOMContentLoaded shim
        for (const content of pendingScripts) {
          const s = document.createElement('script');
          s.textContent = `(function() {
  const _orig = document.addEventListener.bind(document);
  document.addEventListener = function(type, fn, opts) {
    if (type === 'DOMContentLoaded') { fn(); return; }
    return _orig(type, fn, opts);
  };
  ${content}
  document.addEventListener = _orig;
})();`;
          document.body.appendChild(s);
        }

        Reveal.initialize({
          width: 1366,
          height: 768,
          margin: 0.02,
          minScale: 0.2,
          maxScale: 2.0,
          hash: true,
          slideNumber: 'c/t',
          transition: 'convex',
          backgroundTransition: 'fade',
          center: true,
          math: { mathjax: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js', config: 'TeX-AMS_HTML-full' },
          plugins: [RevealNotes, RevealHighlight, RevealMath.MathJax3, RevealZoom],
        });

        if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();

        Reveal.on('slidechanged', function(event) {
          initCanvasFor(event.currentSlide);
        });

        // Deep-link (hash): inicializa canvas do slide atual sem precisar navegar
        Reveal.on('ready', function(event) {
          initCanvasFor(event.currentSlide);
        });

        function initCanvasFor(slide) {
          if (!slide) return;
          var wiring = [
            ['#capa-eixo-z-canvas', window.vizCapaR3],
            ['#r3-vetores-canvas', window.vizR3Vetores],
            ['#produto-interno-r3-canvas', window.vizProdutoInternoR3],
            ['#produto-vetorial-canvas', window.vizProdutoVetorial],
            ['#produto-misto-canvas', window.vizProdutoMisto],
            ['#equacao-plano-canvas', window.vizEquacaoPlano],
            ['#equacao-reta-espaco-canvas', window.vizEquacaoReta]
          ];
          wiring.forEach(function (pair) {
            if (slide.querySelector(pair[0]) && pair[1]) pair[1].init();
          });
        }
      }

      loadAndInit();
    </script>
    <script src="capitulo-vi/simulators.js?v=3"></script>
  </body>
</html>
